name: Deploy React Vite App to Pages

on:
  push:
    branches: ["main"] # 当 main 分支有代码推送时触发
  workflow_dispatch:   # 允许在 GitHub 后台手动触发

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # Vite 默认打包生成的静态目录

      # 先生成 CNAME 文件放入 dist（移到这里）
      - name: Create CNAME file
        run: echo "thinkpipeai.tech" > ./dist/CNAME

      # 最后再执行部署
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4