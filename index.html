<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thinkpipe AI Lab</title>
  <link rel="stylesheet" href="./app.css">
</head>

<body class="bg-gray-100">

  <main class="p-5">
    <h1 class="text-center text-6xl text-green-400">Thinkpipe AI</h1>

    <div class="my-4 h-10 w-full rounded-md border border-violet-950 bg-violet-200 p-2">
      <p class="font-momo text-center font-extrabold">A div</p>
    </div>

    <div class="my-4 h-10 w-full rounded-md border border-violet-950 bg-violet-200 p-2">
      <p class="font-momo text-center font-extrabold">A div</p>
    </div>

    <!-- Layout -->
    <!-- Position  -->
    <div class="fixed top-0 h-10 w-10 bg-red-500"></div>
    <!-- Display  -->
    <div class="flex justify-between space-x-2">
      <div class="h-16 w-16 rounded-full bg-blue-500"></div>
      <div class="h-16 w-16 rounded-full bg-blue-500"></div>
      <div class="h-16 w-16 rounded-full bg-blue-500"></div>
      <div class="h-16 w-16 rounded-full bg-blue-500"></div>
    </div>

    <div class="mt-3 grid grid-cols-3 gap-2">
      <div class="h-12 bg-violet-500"></div>
      <div class="h-12 bg-violet-500"></div>
      <div class="h-12 bg-violet-500"></div>
      <div class="h-12 bg-violet-500"></div>
      <div class="h-12 bg-violet-500"></div>
      <div class="h-12 bg-violet-500"></div>
    </div>
    <!-- Flexbox -->
    <div class="hidden md:block">
      <p>I will appear for device resolution > 768px</p>
    </div>
    <div class="hidden max-md:block">
      <p>I will appear for device resolution < 768px</p>
    </div>

    <button
      class="my-2 rounded-lg bg-blue-500 px-4 py-2 text-white hover:bg-blue-700 focus:ring focus:ring-blue-300 focus:outline-none active:bg-blue-900">Click
      Me</button>

    <ul class="my-2 space-y-2">
      <li class="bg-white p-2 first:bg-yellow-100 odd:bg-blue-200 even:bg-green-200">Item 1</li>
      <li class="bg-white p-2 first:bg-yellow-100 odd:bg-blue-200 even:bg-green-200">Item 2</li>
      <li class="bg-white p-2 first:bg-yellow-100 odd:bg-blue-200 even:bg-green-200">Item 3</li>
      <li class="bg-white p-2 first:bg-yellow-100 odd:bg-blue-200 even:bg-green-200">Item 4</li>
      <li class="bg-white p-2 first:bg-yellow-100 odd:bg-blue-200 even:bg-green-200">Item 5</li>
    </ul>
  </main>


</body>

</html>
